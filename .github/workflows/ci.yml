name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with. `vcs lock` pins
  # source hashes but not the bundled `std`, so the compiler version has to be
  # stated somewhere; here is where. Raising it is a deliberate act.
  CANCHO_REV: a4572ea3b506e4bcec1c4be43deda1043c11ba9f

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: schema

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Reference validator
        run: pip install jsonschema

      - name: Unit tests
        working-directory: schema
        run: ../cancho/target/release/cancho test tests/schema_test.cho src/schema.cho --std

      - name: Differential tests against jsonschema
        working-directory: schema
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: |
          for seed in 1 2 3 4; do
            python3 tests/differential.py --cases 250 --seed "$seed"
          done

      # The README quotes this output; the file it is checked against is the same
      # one, so a README that drifts from the code is a red build.
      - name: The examples print what the README says
        working-directory: schema
        run: |
          for e in quickstart validate; do
            ../cancho/target/release/cancho run --std examples/$e.cho src/schema.cho | diff - examples/$e.out
          done
